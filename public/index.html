<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="小芽印坊，生成可以打印、裁剪的数字方格与算术题卡。支持描红、中文数字、数量点与十宫格，自选字体、格子大小与份数，A4 原尺寸打印。">
  <meta name="theme-color" content="#3d614d">
  <title>小芽印坊 · 数字裁剪格</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/noto-sans-sc-digits.woff2" as="font" type="font/woff2">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="小芽印坊首页">
      <img src="favicon.svg" alt="" width="32" height="32">
      <h1 class="brand-name">小芽印坊</h1>
      <span class="brand-tag">数字裁剪格打印工具</span>
    </a>
  </header>

  <main>
    <div class="workspace">
      <aside class="settings" aria-label="练习纸设置">
        <div class="settings-title"><h2>打印设置</h2></div>
        <div class="settings-body">
        <fieldset class="template-picker"><legend>内容</legend>
          <label class="template-option"><input type="radio" name="template" value="number" checked><span>数字格子</span></label>
          <label class="template-option"><input type="radio" name="template" value="trace"><span>描红格子</span></label>
          <label class="template-option"><input type="radio" name="template" value="math"><span>算术题卡</span></label>
        </fieldset>
        <div class="range-field" id="range-field"><label for="range">数字范围</label><span class="field-control"><select id="range"><option value="1-10">1 到 10</option><option value="11-20">11 到 20</option><option value="1-20">1 到 20</option><option value="custom">自定义数字…</option></select></span></div>
        <div class="custom-field" id="custom-field" hidden>
          <label for="custom-numbers">自定义数字</label>
          <input id="custom-numbers" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="例：1, 3, 5-8, 12" value="1, 3, 5-8, 12" aria-describedby="custom-hint">
          <p class="field-hint" id="custom-hint">用逗号或空格分隔，也可以写 5-8 这样的范围，最多 100 个。</p>
        </div>
        <div class="range-field" id="math-field" hidden><label for="math">题目类型</label><span class="field-control"><select id="math"><option value="add10">10 以内加法</option><option value="sub10">10 以内减法</option><option value="mix10">10 以内加减混合</option><option value="add20">20 以内加法</option><option value="sub20">20 以内减法</option><option value="mix20">20 以内加减混合</option></select></span></div>
        <div class="toggle-list">
          <label class="toggle"><input type="checkbox" id="shuffle"><span>打乱顺序</span></label>
          <label class="toggle"><input type="checkbox" id="blank"><span>空白书写格</span></label>
          <label class="toggle"><input type="checkbox" id="label"><span>中文数字</span></label>
        </div>
        <div class="range-field" id="quantity-field"><label for="quantity">数量提示</label><span class="field-control"><select id="quantity"><option value="none">不显示</option><option value="dots">圆点</option><option value="ten">十宫格</option></select></span></div>
        <div class="range-field font-field"><label for="font">数字字体</label><span class="field-control"><select id="font"><option value="sans">思源黑体</option><option value="wenkai">霞鹜文楷</option><option value="serif">思源宋体</option></select></span><div class="font-sample" aria-label="所选字体预览">1234567890</div></div>
        <div class="field-row"><div class="range-field"><label for="size">格子大小</label><span class="field-control"><select id="size"><option value="quarter">A4 四等分（4 格）</option><option value="eighth">A4 八等分（8 格）</option><option value="40">4 厘米正方形</option><option value="50" selected>5 厘米正方形</option><option value="60">6 厘米正方形</option></select></span></div><div class="range-field"><label for="copies">重复份数</label><span class="field-control"><select id="copies"><option value="1">1 份</option><option value="2">2 份</option><option value="3">3 份</option></select></span></div></div>
        <div class="color-field"><span id="color-label">打印颜色</span><div class="segmented" role="group" aria-labelledby="color-label"><button type="button" data-color="mono" aria-pressed="true"><span class="swatch swatch-mono" aria-hidden="true"></span>黑白省墨</button><button type="button" data-color="color" aria-pressed="false"><span class="swatch swatch-color" aria-hidden="true"></span>柔和彩色</button></div></div>
        </div>
        <p class="printing-note">选择 A4、纵向、100% 实际大小，关闭浏览器页眉页脚；也可以在打印窗口中保存为 PDF。</p>
      </aside>

      <section class="preview" aria-label="练习纸预览">
        <div class="preview-toolbar"><div><h2>打印预览</h2></div><div class="toolbar-actions"><span class="paper-badge">A4 纵向</span><button class="print-button" id="print" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M7 8V3h10v5M7 17H4V8h16v9h-3M7 13h10v8H7z"/><path d="M16 10h2"/></svg>打印练习纸</button></div></div>
        <div class="paper-stage"><div class="paper-stack monochrome" id="sheets"></div></div>
        <div class="preview-footer"><span id="page-summary" role="status" aria-live="polite"></span><button class="share-button" id="share" type="button">复制设置链接</button></div>
      </section>
    </div>

  </main>
</body>
</html>
